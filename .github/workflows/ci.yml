name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  COVERAGE_THRESHOLD: 70

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run security:audit

      - name: Linting
        run: npm run lint

      - name: Build the application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.lifestack.app' }}

      - name: Enforce test coverage
        run: npm run test -- --coverage --coverage.reporter=text --coverage.reporter=lcov --coverage.thresholds.lines=${COVERAGE_THRESHOLD}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.lifestack.app' }}

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          extra_args: --results=verified

  trigger-e2e:
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # paths-filter inspects the git history, so the repository has to be
      # checked out in this job. On a push it diffs the event's `before` SHA
      # against the new head, so both must be present locally -- a full
      # fetch is used because the repo is small (~15MB) and it removes any
      # shallow-clone ambiguity around merge commits.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only dispatch the E2E suite when this merge can actually change what
      # the suite sees. The E2E workflow checks out this repository and
      # rebuilds the web-e2e image from source, so a docs-only or test-only
      # change cannot affect the result -- and a full E2E run takes ~1h when
      # it is failing. dorny/paths-filter is used rather than the
      # `on.push.paths` trigger because that filter would also skip this
      # repo's own CI, which must still run on every push.
      - name: Detect runtime changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          # 'some-with-excludes' is required: with the default 'some'
          # quantifier a negated pattern matches everything, which would
          # invert this filter.
          predicate-quantifier: some-with-excludes
          # Runtime inputs of the web-e2e image: the sources it bundles, the
          # static assets it serves, and the files that decide how it builds.
          filters: |
            runtime:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'eslint.config.js'
              # Test files are excluded: they run in this repo's own CI and do
              # not change the behaviour of the built bundle.
              - '!src/**/*.test.*'
              - '!src/**/*.spec.*'
              - '!src/test/**'

      - name: Trigger E2E pipeline
        if: steps.changes.outputs.runtime == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.E2E_DISPATCH_TOKEN }}
          repository: sajankp/lifestack-e2e
          event-type: api-web-merge
          client-payload: '{"ref": "${{ github.sha }}", "repo": "${{ github.repository }}"}'
